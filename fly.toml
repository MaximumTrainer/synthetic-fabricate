# Fly.io reference deployment for Fabricate (#61).
#
# The API is stateless: all durable state lives in PostgreSQL, so machines can scale to zero and back, and the
# count can exceed one with no configuration change. Secrets are NEVER set here — see `fly secrets set` in
# docs/how-to/self-hosting.md:
#   FABRICATE_CONNECTION_STRING   PostgreSQL connection string. Set it by hand for an external free-tier database
#                                 (Neon/Supabase, the low-cost default), or let `fly mpg attach` write it for Fly
#                                 Managed Postgres. NOT `fly postgres attach` - unmanaged Fly Postgres is
#                                 deprecated and unsupported. See docs/how-to/self-hosting.md, "Cost".
#   FABRICATE__BootstrapApiKey    first-run API key
#   <your LLM key variable>       the variable that FABRICATE_LLM_API_KEY_SECRET names, e.g. ANTHROPIC_API_KEY

app = "fabricate"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  FABRICATE_DB_PROVIDER = "postgres"
  # Operator (platform) LLM credential. Remove PROVIDER to run with per-workspace credentials only.
  FABRICATE_LLM_PROVIDER = "anthropic"
  FABRICATE_LLM_MODEL = "claude-opus-5"
  FABRICATE_LLM_ALLOWED_MODELS = "claude-opus-5,claude-sonnet-5"
  FABRICATE_LLM_API_KEY_SECRET = "ANTHROPIC_API_KEY"
  # A single-operator instance: every workspace may use the platform credential.
  FABRICATE_LLM_PLATFORM_FALLBACK = "always"
  FABRICATE_LLM_TIMEOUT_SECONDS = "120"
  # Data Protection key ring, in the database rather than on disk (#76). A Fly machine's filesystem does not
  # survive replacement and is not shared between machines, so the previous file-system path lost the ability to
  # decrypt every stored tenant credential the first time a machine was replaced — permanently, with the
  # ciphertext still sitting in PostgreSQL. The database store is what makes scale-to-zero and `fly scale count`
  # safe for per-workspace credentials.
  FABRICATE_DATA_PROTECTION_KEY_STORE = "database"
  # Wrap the ring with a KMS key and this line goes away — see the self-hosting guide. Without a key-encryption
  # key the ring sits in the same database as the secrets it protects, so one dump decrypts both; that is still a
  # better position than losing the ring on every deploy, but it is a trade-off and it is stated rather than
  # assumed. After configuring a KEK, run `fabricate secrets rewrap` once: enabling it does not reach back over
  # entries already written.
  FABRICATE_DATA_PROTECTION_ALLOW_UNWRAPPED = "true"

  # Generated artifacts (#84, #90). The default is the OS temp directory, which on Fly is ephemeral, so a
  # completed run ends up pointing at files that no longer exist. Uncomment and set the bucket to keep them:
  # FABRICATE_ARTIFACT_STORE = "s3"
  # FABRICATE_ARTIFACT_BUCKET = "fabricate-artifacts"
  # FABRICATE_ARTIFACT_S3_ENDPOINT = "https://<account>.r2.cloudflarestorage.com"
  # FABRICATE_ARTIFACT_S3_REGION = "auto"
  # FABRICATE_ARTIFACT_S3_FORCE_PATH_STYLE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Grace period is derived from the measured cold start (see docs/how-to/self-hosting.md, "Cold start").
  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
