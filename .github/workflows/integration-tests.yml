name: Integration Tests

# Integration tests that need something the main CI job does not provide (#57, #91).
#
# The NoSQL adapters no longer live here: DynamoDB, Firestore and MongoDB run against emulators in the main CI
# job, with no credentials at all. What is left is the work that genuinely cannot run there — the Cosmos DB
# emulator, which is too heavy for every push, and the behavioural eval against a real model, which costs money.
# Each self-gates and prints whether it was exercised, so a missing secret is visible rather than silent.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "1"

jobs:
  postgres:
    name: PostgreSQL (schema discovery + persistence)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fabricate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FABRICATE_POSTGRES_TEST_CONNECTION: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=fabricate_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Fabricate.slnx
      - run: dotnet build Fabricate.slnx --no-restore --configuration Release
      - name: Run PostgreSQL tests
        run: >
          dotnet test Fabricate.Tests/Fabricate.Tests.csproj --no-build --configuration Release
          --filter "FullyQualifiedName~PostgreSql|FullyQualifiedName~PostgresPersistence"
          --logger "console;verbosity=normal"

  cosmos:
    name: Cosmos DB (emulator)
    runs-on: ubuntu-latest
    # The Cosmos emulator is a multi-gigabyte image that takes minutes to become healthy, which is why it is here
    # on a weekly schedule rather than in the main CI job alongside DynamoDB and Firestore.
    env:
      FABRICATE_COSMOS_EMULATOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Fabricate.slnx
      - run: dotnet build Fabricate.slnx --no-restore --configuration Release
      - name: Run NoSQL emulator tests with Cosmos enabled
        run: >
          dotnet test Fabricate.Tests/Fabricate.Tests.csproj --no-build --configuration Release
          --filter "FullyQualifiedName~NoSqlEmulatorTests"
          --logger "console;verbosity=detailed"

  agent-eval:
    name: Clarifying-question eval (live model)
    runs-on: ubuntu-latest
    environment: integration
    env:
      FABRICATE_LIVE_LLM_API_KEY: ${{ secrets.FABRICATE_LIVE_LLM_API_KEY }}
      FABRICATE_LIVE_LLM_MODEL: ${{ vars.FABRICATE_LIVE_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Report whether the eval is enabled (the key is never printed)
        run: |
          if [ -n "$FABRICATE_LIVE_LLM_API_KEY" ]; then
            echo "enabled: FABRICATE_LIVE_LLM_API_KEY is set; the eval will call a real model."
            # The job has a key, so the eval must genuinely run. This turns the suite's self-skip into a failure,
            # so a key that is configured here but does not reach the test is red rather than a quiet pass (#91).
            echo "FABRICATE_REQUIRE_LIVE_EVAL=1" >> "$GITHUB_ENV"
          else
            echo "::notice::FABRICATE_LIVE_LLM_API_KEY is not set; clarifying-question behaviour will NOT be verified. The eval will skip and say so. Set the secret on the 'integration' environment to enable it."
          fi

      - run: dotnet restore Fabricate.slnx
      - run: dotnet build Fabricate.slnx --no-restore --configuration Release
      - name: Run the clarifying-question eval
        run: >
          dotnet test Fabricate.Tests/Fabricate.Tests.csproj --no-build --configuration Release
          --filter "FullyQualifiedName~AgentClarificationLiveEvalTests"
          --logger "console;verbosity=detailed"
